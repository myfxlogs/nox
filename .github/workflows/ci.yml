name: ci
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build-test:
    runs-on: ubuntu-latest
    # 修复⑭ S6：注入 postgres service，DSN 集成测试在 CI 真跑（CI 绿=集成绿）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nox_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          # D-021：与本地测试实例同坐标（5434）——CI/本地一套 DSN 口径
          - 5434:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.68.3
      - run: npm ci --legacy-peer-deps
        working-directory: web
      # web/src/gen 不入库（gitignore）——npm build 前重产（protoc-gen-es 在 node_modules）
      - run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
          buf generate
      # 前端产物须在 go build 之前（embed.go go:embed web/dist）
      - run: npm run build
        working-directory: web
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      # D-514 T1：分层方向门禁与 pre-commit 同令（D-212 部门目录白名单冻结）。
      - run: ./scripts/check_import_direction.sh
      # gofmt 全树 sweep。
      - run: |
          UNFMT=$(gofmt -l . || true)
          if [ -n "$UNFMT" ]; then
            echo "FAIL: gofmt 漂移: $UNFMT —— gofmt -w 后重试" >&2
            exit 1
          fi
      # 测试面：go test ./... 全量（DSN 注入 5434，缺 DSN 的 skip 语义不变）。
      # ulimit -n 提 hard limit（race detector + pgxpool fd 压力先例 D-177/D-255）。
      - run: ulimit -n $(ulimit -Hn) && go test ./... -count=1 -timeout=1800s
        env:
          NOX_TEST_PG_DSN: "postgres://postgres:test@localhost:5434/nox_test?sslmode=disable"
          NOX_TEST_PG_SERVICE_DSN: "postgres://postgres:test@localhost:5434/nox_service_test?sslmode=disable"
          NOX_EXEC_TEST_PG_DSN: "postgres://postgres:test@localhost:5434/nox_exec_test?sslmode=disable"
          NOX_RECONCILE_TEST_PG_DSN: "postgres://postgres:test@localhost:5434/nox_reconcile_test?sslmode=disable"
      # -race：M2.1 数据部目录（后续 M2.x 每票追加各自部门目录）。
      - run: ulimit -n $(ulimit -Hn) && go test -race -count=1 ./internal/data/...
        env:
          NOX_TEST_PG_DSN: "postgres://postgres:test@localhost:5434/nox_test?sslmode=disable"
          NOX_TEST_PG_SERVICE_DSN: "postgres://postgres:test@localhost:5434/nox_service_test?sslmode=disable"
          NOX_EXEC_TEST_PG_DSN: "postgres://postgres:test@localhost:5434/nox_exec_test?sslmode=disable"
          NOX_RECONCILE_TEST_PG_DSN: "postgres://postgres:test@localhost:5434/nox_reconcile_test?sslmode=disable"
      - run: ./scripts/check-lines.sh
