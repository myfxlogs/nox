# mt4/mt5 代码生成——严格隔离，不与 dashboard 混生成。
# mt4 和 mt5 是完全不同的平台，proto 独立、生成路径独立、包名独立。
# 生成命令：buf generate --template buf.gen.mtapi.yaml
version: v2
plugins:
  - local: protoc-gen-go
    out: internal/data/adapter/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/data/adapter/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: internal/data/adapter/gen
    opt: paths=source_relative
inputs:
  - directory: proto
    paths:
      - proto/mtapi/mt4
      - proto/mtapi/mt5
