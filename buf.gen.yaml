# 代码生成——两个模板隔离：
#   buf generate                              # dashboard（Go + TS）
#   buf generate --template buf.gen.mtapi.yaml # mt4/mt5（Go gRPC + ConnectRPC，严格隔离）
version: v2
plugins:
  - local: protoc-gen-go
    out: internal/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: internal/gen
    opt: paths=source_relative
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
inputs:
  - directory: proto
    paths:
      - proto/dashboardv1
