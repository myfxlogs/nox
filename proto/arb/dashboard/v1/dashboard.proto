syntax = "proto3";

package arb.dashboard.v1;

import "google/protobuf/timestamp.proto";

option go_package = "arb/internal/dashboard/gen/arb/dashboard/v1;dashboardv1";

// DashboardService — Web 仪表盘 ConnectRPC 服务（架构设计 §8.2）。
// 写 RPC 仅限：告警确认/台账/经验复核/执行确认；无策略管理、无自动开仓入口。
// 全部 RPC 经认证 interceptor（§13.5）；执行类 RPC 额外校验风控上限。
service DashboardService {
  // 快照类
  rpc ListLatestQuotes(ListQuotesRequest) returns (ListQuotesResponse);
  rpc ListLatestFacts(ListLatestFactsRequest) returns (ListLatestFactsResponse);
  rpc ListOpportunities(ListOpportunitiesRequest) returns (ListOpportunitiesResponse);
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
  rpc ListTriggerStates(ListTriggerStatesRequest) returns (ListTriggerStatesResponse);
  rpc ListSourceHealth(ListSourceHealthRequest) returns (ListSourceHealthResponse);
  rpc ListFacts(ListFactsRequest) returns (ListFactsResponse);

  // 告警确认
  rpc AckAlert(AckAlertRequest) returns (AckAlertResponse);
  rpc AckAll(AckAllRequest) returns (AckAllResponse);
  rpc ListUnacked(ListUnackedRequest) returns (ListUnackedResponse);
  // 告警删除
  rpc DeleteAlerts(DeleteAlertsRequest) returns (DeleteAlertsResponse);
  rpc ClearAckedAlerts(ClearAckedAlertsRequest) returns (ClearAckedAlertsResponse);

  // 台账
  rpc AddLedgerEntry(AddLedgerEntryRequest) returns (AddLedgerEntryResponse);
  rpc ListLedgerEntries(ListLedgerEntriesRequest) returns (ListLedgerEntriesResponse);
  rpc LedgerSummary(LedgerSummaryRequest) returns (LedgerSummaryResponse);

  // 记账（财务线工作项 2：结构化投资记录，决定/教训/观察）
  rpc AddInvestmentRecord(AddInvestmentRecordRequest) returns (AddInvestmentRecordResponse);
  rpc ListInvestmentRecords(ListInvestmentRecordsRequest) returns (ListInvestmentRecordsResponse);

  // 经验库
  rpc ListKnowledgeEntries(ListKnowledgeEntriesRequest) returns (ListKnowledgeEntriesResponse);

  // 执行（认证后，§13）
  rpc ExecuteOpportunity(ExecuteOpportunityRequest) returns (ExecuteOpportunityResponse);
  rpc ClosePosition(ClosePositionRequest) returns (ClosePositionResponse);
  rpc BackfillSwapHistory(BackfillSwapHistoryRequest) returns (BackfillSwapHistoryReply); // D-181 S1：手动回溯 venue swap 历史→facts
  // CN-FI 固收雷达快照（D-226/D-237；只读快照，无流式——日频数据不接 streamUpdates）
  rpc GetCNFIRadarSnapshot(GetCNFIRadarSnapshotRequest) returns (GetCNFIRadarSnapshotResponse);
  // CN-FI 四层进度（P3；比例+工具名，响应零金额字段——D-047：金额只在运行时 DB）
  rpc GetCNFIProgress(GetCNFIProgressRequest) returns (GetCNFIProgressResponse);
  // CN-FI 手动持仓录入（P3；L2 人工确认铁律，系统永不下单）
  rpc AddCNFIHolding(AddCNFIHoldingRequest) returns (AddCNFIHoldingResponse);
  // CN-FI 操作日志/投资笔记（D-242；金额=运行时个人数据，L2 人工）
  rpc AddCNFIAction(AddCNFIActionRequest) returns (AddCNFIActionResponse);
  rpc ListCNFIActions(ListCNFIActionsRequest) returns (ListCNFIActionsResponse);
  // D-270：逆回购操作记录列表（周四操作闭环审计）
  rpc ListRepoOps(ListRepoOpsRequest) returns (ListRepoOpsResponse);
  rpc ListPositions(ListPositionsRequest) returns (ListPositionsResponse);

  // Broker 实持仓（D-051 WP3：MT5/MT4 实际持仓统一视图，实时查不落库）
  rpc ListBrokerPositions(ListBrokerPositionsRequest) returns (ListBrokerPositionsResponse);
  rpc CloseBrokerPosition(CloseBrokerPositionRequest) returns (CloseBrokerPositionResponse);
  rpc CloseBrokerPositions(CloseBrokerPositionsRequest) returns (CloseBrokerPositionsResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  // 个人持仓（财务线 TRX 持仓接入，D-046）+ 实账化（财务线工作项 3）
  rpc ListPersonalPositions(ListPersonalPositionsRequest) returns (ListPersonalPositionsResponse);
  rpc GetHedgeStructure(GetHedgeStructureRequest) returns (GetHedgeStructureResponse);  // D-212 对冲工作台
  rpc ListHedgeFlow(ListHedgeFlowRequest) returns (ListHedgeFlowResponse);  // D-212 统一流水卡
  rpc TrxAccountRefresh(TrxAccountRefreshRequest) returns (TrxAccountRefreshResponse);  // D-254：手动刷新按钮+on-open 双踢 trx_account+trx_apr，返回最新 fin_trx_account 全字段快照
  rpc GetTrxYieldRadar(GetTrxYieldRadarRequest) returns (GetTrxYieldRadarResponse);  // D-258 S3：收益率雷达（能量 7d/30d + 投票 APR + floor）
  rpc GetTrxYieldCurve(GetTrxYieldCurveRequest) returns (GetTrxYieldCurveResponse);  // D-278 S1：净收益率日曲线（三成分日序列+7d/30d 滚动年化+S4 敞口）
  rpc GetRepoRateRadar(GetRepoRateRadarRequest) returns (GetRepoRateRadarResponse);  // D-266 S3：逆回购利率雷达（4 品种 + GC007 30d 均值 + OHLC + 窗口提醒）
  rpc AddDailyIncome(AddDailyIncomeRequest) returns (AddDailyIncomeResponse);
  rpc ListDailyIncome(ListDailyIncomeRequest) returns (ListDailyIncomeResponse);

  // 盈亏统计起点（F4：anchor 重置，业主选 A「不删历史」）
  rpc GetPnlAnchor(GetPnlAnchorRequest) returns (GetPnlAnchorResponse);
  rpc ResetPnlAnchor(ResetPnlAnchorRequest) returns (ResetPnlAnchorResponse);

  // 经验库只读浏览（F8：读 docs/经验库/索引.md + 条目全文）
  rpc ListKBEntries(ListKBEntriesRequest) returns (ListKBEntriesResponse);
  rpc GetKBEntry(GetKBEntryRequest) returns (GetKBEntryResponse);

  // 验证统计（D-086 V-Ladder：机会验证阶梯，面板徽章+折叠区）
  rpc ListVerificationStats(ListVerificationStatsRequest) returns (ListVerificationStatsResponse);

  // Broker 管理（认证后，运行时 MT4/MT5 连接管理）
  rpc SearchBroker(SearchBrokerRequest) returns (SearchBrokerResponse);
  rpc AddBroker(AddBrokerRequest) returns (AddBrokerResponse);
  rpc RemoveBroker(RemoveBrokerRequest) returns (RemoveBrokerResponse);
  rpc ListBrokerAccounts(ListBrokerAccountsRequest) returns (ListBrokerAccountsResponse);
  rpc VerifyAccount(VerifyAccountRequest) returns (VerifyAccountResponse);

  // CEX 交易所管理（D-054：后台增删，运行时生效，对齐 broker 账户管理）
  rpc ListExchanges(ListExchangesRequest) returns (ListExchangesResponse);
  rpc AddExchange(AddExchangeRequest) returns (AddExchangeResponse);
  rpc RemoveExchange(RemoveExchangeRequest) returns (RemoveExchangeResponse);
  rpc SetExchangeLabel(SetExchangeLabelRequest) returns (SetExchangeLabelResponse); // D-157 V3：交易所别名编辑
  rpc SetExchangeWebsite(SetExchangeWebsiteRequest) returns (SetExchangeWebsiteResponse); // D-157 V3.1：交易所官网编辑
  rpc BrokerSymbols(BrokerSymbolsRequest) returns (BrokerSymbolsResponse);
  rpc SetBrokerAccountAlias(SetBrokerAccountAliasRequest) returns (SetBrokerAccountAliasResponse);
  rpc SetBrokerAccountIsReal(SetBrokerAccountIsRealRequest) returns (SetBrokerAccountIsRealResponse); // D-144 ①
  rpc SetBrokerDisabled(SetBrokerDisabledRequest) returns (SetBrokerDisabledResponse);
  rpc SetBrokerCommission(SetBrokerCommissionRequest) returns (SetBrokerCommissionResponse);
  rpc SetBrokerWebsite(SetBrokerWebsiteRequest) returns (SetBrokerWebsiteResponse); // D-157 V3.1：broker 官网编辑

  // Symbol 映射（brokerSymbol -> canonical）
  rpc ListSymbolMappings(ListSymbolMappingsRequest) returns (ListSymbolMappingsResponse);
  rpc SaveSymbolMapping(SaveSymbolMappingRequest) returns (SaveSymbolMappingResponse);
  rpc DeleteSymbolMapping(DeleteSymbolMappingRequest) returns (DeleteSymbolMappingResponse);
  rpc ListMappingSuggestions(ListMappingSuggestionsRequest) returns (ListMappingSuggestionsResponse);
  rpc ListCanonicals(ListCanonicalsRequest) returns (ListCanonicalsResponse);
  rpc AutoMapBroker(AutoMapBrokerRequest) returns (AutoMapBrokerResponse);
  // D-140 S3：swap 组合列表（basis_bps 只展示不动排序）
  rpc ListSwapCombos(ListSwapCombosRequest) returns (ListSwapCombosResponse);

  // Matrix 全景（D-045：全符号跨全账号映射/报价巡检）
  rpc ListMatrixUniverse(ListMatrixUniverseRequest) returns (ListMatrixUniverseResponse);

  // 实时推送（server streaming，D-026）
  rpc StreamUpdates(StreamUpdatesRequest) returns (stream StreamUpdatesResponse);

  // 健康
  rpc Health(HealthRequest) returns (HealthResponse);

  // 前端配置同源（D-077 修复⑪B N7）：返回后端 config 阈值供前端展示。
  rpc GetFrontConfig(GetFrontConfigRequest) returns (GetFrontConfigResponse);

  // 理论 vs 实际对账（D-080 S5）：策略聚合卡——承诺年化 vs 实际年化。
  rpc GetStrategyLedger(GetStrategyLedgerRequest) returns (GetStrategyLedgerResponse);

  // 总览自选报价条（D-090）：业主自选 canonical 清单，服务端按此过滤 StreamUpdates case 1。
  rpc GetWatchlist(GetWatchlistRequest) returns (GetWatchlistResponse);
  rpc SetWatchlist(SetWatchlistRequest) returns (SetWatchlistResponse);

  // 分析员（D-091 前端分析员，server streaming + 收件箱 append）
  rpc AskAnalyst(AskAnalystRequest) returns (stream AskAnalystResponse);
  rpc AppendAnalystNote(AppendAnalystNoteRequest) returns (AppendAnalystNoteResponse);
  // D-091 返修② R3：AI 配置 DB 化（前端可配，Get 掩码/Set 空 key 不覆盖）
  rpc GetAiSettings(GetAiSettingsRequest) returns (GetAiSettingsResponse);
  rpc SetAiSettings(SetAiSettingsRequest) returns (SetAiSettingsResponse);
  // D-270 R2：逆回购提醒配置 DB 化（前端可改免重启）
  rpc GetRepoConfig(GetRepoConfigRequest) returns (GetRepoConfigResponse);
  rpc SetRepoConfig(SetRepoConfigRequest) returns (SetRepoConfigResponse);
  // D-271：CEX 只读扫描器快照（理财 APR + 跨所价差 + funding + 余额）
  rpc GetCexScanSnapshot(GetCexScanSnapshotRequest) returns (GetCexScanSnapshotResponse);
  // D-272：逆回购操作记录+策略验证闭环
  rpc RecordRepoTrade(RecordRepoTradeRequest) returns (RecordRepoTradeResponse);
  rpc ListRepoTrades(ListRepoTradesRequest) returns (ListRepoTradesResponse);
  rpc SettleRepoTrade(SettleRepoTradeRequest) returns (SettleRepoTradeResponse);
  rpc DeleteRepoTrade(DeleteRepoTradeRequest) returns (DeleteRepoTradeResponse);
  rpc GetRepoStrategyValidation(GetRepoStrategyValidationRequest) returns (GetRepoStrategyValidationResponse);
  // D-292：价格提醒规则前端管理（CRUD；引擎 30s 重载自动生效，无通知机制）
  rpc ListPriceAlertRules(ListPriceAlertRulesRequest) returns (ListPriceAlertRulesResponse);
  rpc CreatePriceAlertRule(CreatePriceAlertRuleRequest) returns (CreatePriceAlertRuleResponse);
  rpc UpdatePriceAlertRule(UpdatePriceAlertRuleRequest) returns (UpdatePriceAlertRuleResponse);
  rpc DeletePriceAlertRule(DeletePriceAlertRuleRequest) returns (DeletePriceAlertRuleResponse);

  // D-274：事件驱动研判引擎（S8）
  rpc ListEventJudgments(ListEventJudgmentsRequest) returns (ListEventJudgmentsResponse);
  rpc ListPaperTrades(ListPaperTradesRequest) returns (ListPaperTradesResponse);
  rpc AcceptJudgment(AcceptJudgmentRequest) returns (AcceptJudgmentResponse);
  rpc SettlePaperTrade(SettlePaperTradeRequest) returns (SettlePaperTradeResponse);

  // D-348：财务总览聚合（三个数+收益分解+统一流水；后端算，前端零信任零计算）。
  rpc GetFinanceOverview(GetFinanceOverviewRequest) returns (GetFinanceOverviewResponse);
}

// === Quote（§1.1）===

message Quote {
  string symbol = 1;       // canonical symbol（EURUSD / BTCUSDT）
  string venue = 2;        // 场所标识（icmarkets / binance / okx）
  double bid = 3;
  double ask = 4;
  google.protobuf.Timestamp time = 5;  // 报价时刻
  string venue_symbol = 6; // 原始符号
  string venue_type = 7;   // mt4 / mt5 / spot / perp（D-028）
}

message ListQuotesRequest {
  string symbol = 1;  // 空 = 全部 canonical
}

message ListQuotesResponse {
  repeated Quote quotes = 1;
}

// === Fact（§1.2）===

message Fact {
  string kind = 1;    // funding / defi_rate / fx / swap_long / swap_short
  string venue = 2;
  string symbol = 3;
  double value = 4;
  string unit = 5;    // pct_annualized / price / bps_daily
  google.protobuf.Timestamp ts = 6;
  string src = 7;
}

message ListLatestFactsRequest {
  string kind = 1;    // 空 = 全部
  string venue = 2;
  string symbol = 3;
}

message ListLatestFactsResponse {
  repeated Fact facts = 1;
}

message ListFactsRequest {
  string kind = 1;
  string venue = 2;
  string symbol = 3;
  int32 limit = 4;   // ≤0 = 默认 100
  int32 offset = 5;
}

message ListFactsResponse {
  repeated Fact facts = 1;
}

// === Opportunity（§2.6）===

message Opportunity {
  string id = 1;              // "{type}:{canonical}:{venue_a}:{venue_b}:{首次检测 unix 毫秒}"
  string type = 2;            // CROSS_VENUE / CARRY / FUNDING_HEDGE
  string venue_buy = 3;       // "{venue}:{venue_type}"
  string venue_sell = 4;
  double price_buy = 5;
  double price_sell = 6;
  double gross_bps = 7;
  double spread_cost = 8;
  double commission_cost = 9;
  double slippage_cost = 10;
  double swap_cost = 11;
  double net_bps = 12;        // 价差型=一次性 bps；息差型=年化 bps（D-029/D-031）
  optional double breakeven_days = 13;  // 息差型；价差型缺省
  double net_usd = 18;        // 与 net_bps 同语义：价差型=一次性 USD（net_bps/10000×notional）；息差型=年化 USD/年（net_bps/100×notional，D-053）
  double notional_usd = 19;   // 本次 net_usd 换算使用的单笔名义（前端「按单笔 $X 估算」标注，D-053）
  // D-062 显示层 USD 单位化（存储不动，API 派生；CS 缺失 → 全 0，前端回退 bps）：
  double gap_usd_per_unit = 20;     // price_sell − price_buy（$/桶、$/盎司、$/币；入场基差展示口径）
  double net_usd_per_lot = 21;      // 价差型一次性 USD/手 = net_bps/1e4 × CS × price_buy；息差型不填
  double net_usd_per_lot_day = 22;  // 息差型 USD/日/手 = net_bps/100 × CS × price_buy / 365；价差型不填
  double cost_usd_per_lot = 23;     // 一次性摩擦 USD/手 = Σcosts/1e4 × CS × price_buy
  google.protobuf.Timestamp quote_time = 14;
  google.protobuf.Timestamp expires_at = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  // D-086 验证阶梯：后端按 vkey 聚合填入（D-043 前端零信任只渲染）。
  int32 verified_level = 24;    // 0=V0 预估 / 1=V1 已验证（V2 预留）
  double verify_ratio = 25;     // R=Σrealized/Σexpected（不可用=0）
  int32 verify_samples = 26;    // 验证样本数
  string alias_buy = 27;        // D-175：买腿别名（空=回退 venue_buy）
  string alias_sell = 28;       // D-175：卖腿别名（空=回退 venue_sell）
  string asset_class = 29;      // D-300：跨标的同质资产类（XASSET_CARRY 填，如 GOLD；其余类型空）
  string canonical_sell = 30;   // D-300：卖腿 canonical（XASSET_CARRY 跨 canonical 配对填；其余类型空=与买腿同）
  optional double settle_net_bps = 31;   // D-318：结算口径净息差（perp 腿 funding 项以近 7d funding_history 均值替换预测值；单位同 net_bps=年化百分点）。无 perp 腿/缺数据=缺省。
  optional double settle_net_usd = 32;   // D-318：同上 USD 口径（net_usd 同 notional 派生）。
  optional int32  settle_samples = 33;   // D-318：参与均值的期数（两腿取小）。
  bool has_open_position = 34;  // D-331：该机会 id 已有活跃仓位（OPENING/OPEN/LEGGED/CLOSING）
}

message ListOpportunitiesRequest {
  string type = 1;    // 空 = 全部
  int32 limit = 2;    // ≤0 = 默认 50
  int32 offset = 3;
}

message ListOpportunitiesResponse {
  repeated Opportunity opportunities = 1;
}

// === 验证统计（D-086 V-Ladder）===

message VerificationStat {
  string vkey = 1;              // "{type}:{venue_buy}:{venue_sell}"
  int32 samples = 2;            // 验证样本数
  double expected_usd = 3;      // Σ 期望收益 USD
  double realized_usd = 4;      // Σ 实际收益 USD
  double ratio = 5;             // R=realized/expected（不可用=0）
  google.protobuf.Timestamp last_sample_at = 6;  // 最近样本时间
}

message ListVerificationStatsRequest {}

message ListVerificationStatsResponse {
  repeated VerificationStat stats = 1;
}

// === Alert（§2.5）===

message Alert {
  int64 id = 1;
  optional int64 rule_id = 2;  // NULL = 系统级告警（D-027）
  string rule_name = 3;        // rule_id 非空时填
  google.protobuf.Timestamp ts = 4;
  string level = 5;            // info / warn / critical
  string message = 6;
  bool acked = 7;
}

message ListAlertsRequest {
  int32 limit = 1;   // ≤0 = 默认 100
  int32 offset = 2;
}

message ListAlertsResponse {
  repeated Alert alerts = 1;
}

message AckAlertRequest {
  int64 id = 1;
}

message AckAlertResponse {}

message AckAllRequest {}

message AckAllResponse {}

message ListUnackedRequest {}

message ListUnackedResponse {
  repeated Alert alerts = 1;
  int32 count = 2;
}

message DeleteAlertsRequest {
  repeated int64 ids = 1;
}

message DeleteAlertsResponse {
  int32 deleted = 1;
}

message ClearAckedAlertsRequest {}

message ClearAckedAlertsResponse {
  int32 deleted = 1;
}

// === TriggerState（§2.4）===

message TriggerState {
  string rule_name = 1;
  string state = 2;                     // armed / active / resolved
  google.protobuf.Timestamp since = 3;
  optional double last_value = 4;
}

message ListTriggerStatesRequest {}

message ListTriggerStatesResponse {
  repeated TriggerState states = 1;
}

// === SourceHealth（§1.2 源健康）===

message SourceHealth {
  string venue = 1;          // {venue}:{venue_type}
  string state = 2;          // up / idle / down
  google.protobuf.Timestamp last_event_at = 3;
}

message ListSourceHealthRequest {}

message ListSourceHealthResponse {
  repeated SourceHealth sources = 1;
}

// === Ledger（§2.8）===

message LedgerEntry {
  int64 id = 1;
  google.protobuf.Timestamp date = 2;
  string channel = 3;
  string currency = 4;
  double amount = 5;         // 正 = 入金，负 = 出金
  double fee_rate = 6;
  string tier = 7;
  string note = 8;
}

message AddLedgerEntryRequest {
  google.protobuf.Timestamp date = 1;
  string channel = 2;
  string currency = 3;
  double amount = 4;
  double fee_rate = 5;
  string tier = 6;
  string note = 7;
}

message AddLedgerEntryResponse {
  int64 id = 1;
}

message ListLedgerEntriesRequest {
  int32 limit = 1;   // ≤0 = 默认 100
  int32 offset = 2;
}

message ListLedgerEntriesResponse {
  repeated LedgerEntry entries = 1;
}

message LedgerSummaryRequest {}

message TierSummary {
  string tier = 1;
  double inflow = 2;
  double outflow = 3;
  double net = 4;
  int32 entry_count = 5;
}

message LedgerSummaryResponse {
  repeated TierSummary items = 1;
}

// === InvestmentRecord（记账，财务线工作项 2）===

message InvestmentRecord {
  int64 id = 1;
  string kind = 2;        // decision | lesson | observation
  string asset = 3;
  string content = 4;
  google.protobuf.Timestamp ts = 5;
}

message AddInvestmentRecordRequest {
  string kind = 1;
  string asset = 2;
  string content = 3;
}

message AddInvestmentRecordResponse { int64 id = 1; }

message ListInvestmentRecordsRequest {
  string kind = 1;     // 空 = 全部
  string asset = 2;    // 子串匹配（ILIKE）
  string q = 3;        // 内容搜索（ILIKE），空 = 不筛
  int32  limit = 4;    // ≤0 默认 200
  int32  offset = 5;
}

message ListInvestmentRecordsResponse { repeated InvestmentRecord items = 1; }

// === KnowledgeEntry（§2.9）===

message KnowledgeEntry {
  int64 id = 1;
  google.protobuf.Timestamp ts = 2;
  string signature = 3;
  string venue = 4;
  string symbol = 5;
  string verdict = 6;
  string rationale = 7;
  string source = 8;
  string status = 9;                    // active / superseded / retracted
  google.protobuf.Timestamp validated_at = 10;
  string validation_note = 11;
}

message ListKnowledgeEntriesRequest {}

message ListKnowledgeEntriesResponse {
  repeated KnowledgeEntry entries = 1;
}

// === Position（§2.11 + §13）===

message PositionLeg {
  int64 id = 1;
  int64 position_id = 2;
  int32 leg_no = 3;
  string phase = 4;            // OPEN / CLOSE
  string venue = 5;            // {venue}:{venue_type}
  string account = 6;
  string symbol = 7;
  string side = 8;             // BUY / SELL
  double qty = 9;
  double price_expected = 10;
  optional double price_actual = 11;
  string order_id = 12;
  string status = 13;          // PENDING / SUBMITTED / FILLED / FAILED / UNKNOWN
  google.protobuf.Timestamp ts = 14;
}

message Position {
  int64 id = 1;
  string opportunity_id = 2;
  string type = 3;             // CROSS_VENUE / CARRY / FUNDING_HEDGE
  string status = 4;           // OPENING / OPEN / LEGGED / CLOSING / CLOSED / FAILED
  double expected_net_bps = 5;
  optional double realized_pnl = 6;
  google.protobuf.Timestamp opened_at = 7;
  google.protobuf.Timestamp closed_at = 8;
  string note = 9;
  repeated PositionLeg legs = 10;
  optional double expected_annual_pct = 11;  // D-080 S3：承诺年化%（funding 直存/SWAPARB·CARRY 换算/收敛型缺省）
  optional double expected_swap_bps_daily = 12;  // D-095：SWAPARB 日 swap bps（typed 列透传，D-087 已建库未上 proto）
  optional double floating_pnl_usd        = 13;  // D-095：浮动（broker profit 匹配和；未匹配=缺省）
  optional double swap_accrued_usd        = 14;  // D-095：已收息差（broker swap 匹配和）
  optional double net_pnl_usd             = 15;  // D-095：净盈亏=13+14
  optional double expected_swap_usd_to_date = 16; // D-095：预期应得（SWAPARB/CARRY）
  optional double attainment_pct          = 17;  // D-095：达成率 16 vs 14（息差型）
  optional double current_net_bps         = 18;  // D-095：收敛型当前 bps（rollup 最新）
  optional double settled_realized_usd    = 19;  // D-106：结算口径 realized_usd（position_settlements join；无结算行=缺省）
  optional double settled_notional_usd    = 20;  // D-106：结算口径 notional_usd（同上）
  optional double hold_days               = 21;  // D-106：持有天数（结算行 hold_days 优先；否则 closed_at−opened_at）
  optional double break_even_days         = 22;  // D-117：回本周期（净值<0÷日均实际swap；≥0=0已回本；日均swap≤0=缺省）
  optional double expected_breakeven_days = 23;  // D-311 R10：预期回本（opp.breakeven_days 透传，实测缺省时回落显示）
  optional double live_net_carry_pct = 24;   // D-340：OPEN 息差型当前净 carry（年化百分点；与引擎退出判定 recalcXAssetNetCarry 同源；缺省=facts 过期 fail-closed 或非息差型）
  optional double realized_annual_pct = 25;  // D-340：CLOSED 已实现年化（realized_pnl/(入场名义×持有天数)×365×100；缺省=名义/天数不可得）
}

message ExecuteOpportunityRequest {
  string opportunity_id = 1;
  string request_id = 2;       // 客户端生成，幂等
  string venue_buy_account = 3;   // 买腿账户名
  string venue_sell_account = 4;  // 卖腿账户名
  double qty = 5;              // 买腿数量（卖腿服务端反算，D-028）
}

message ExecuteOpportunityResponse {
  int64 position_id = 1;
  string status = 2;           // OPENING / FAILED
  string message = 3;          // 失败原因（风控拒绝/劣化超阈等）
}

message ClosePositionRequest {
  int64 position_id = 1;
}

message ClosePositionResponse {
  string status = 1;           // CLOSING / FAILED
  string message = 2;
}

// D-181 S1：BackfillSwapHistory——手动回溯 venue swap 历史→facts（src=order_history）。
message BackfillSwapHistoryRequest {
  string venue = 1;            // venueKey 如 "61585565:mt5"
}
message BackfillSwapHistoryReply {
  int32 orders_scanned = 1;    // 扫描的已平仓订单数
  int32 facts_written = 2;     // 写入的 swap_settled facts 数
  string summary = 3;          // 人类可读摘要（含空历史/降级提示）
}

message ListPositionsRequest {
  string status = 1;  // 空 = 全部；"ACTIVE" = OPEN/OPENING/LEGGED/CLOSING 任一（在仓 Tab，D-106）；其余 = 单一状态
  int32 limit = 2;    // ≤0 = 默认 50
  int32 offset = 3;
}

message ListPositionsResponse {
  repeated Position positions = 1;
  int32 total = 2;  // D-069：符合筛选条件的总数（分页控件用）
}

// === Broker 持仓（MT5/MT4 实际持仓统一视图，D-051 WP3）===

message BrokerPosition {
  string venue = 1;            // 裸 venue 名
  string venue_key = 2;        // "{venue}:{venueType}"
  string ticket = 3;           // venue 订单号（字符串，可能超 JS 安全整数）
  string symbol = 4;           // venue 原生符号
  string canonical = 5;        // 解析后的 canonical；未映射 → ""（诚实空态）
  string side = 6;             // BUY / SELL
  double volume = 7;
  double open_price = 8;
  double current_price = 9;    // 0 + fresh=false = 无报价（诚实空态）
  bool fresh = 10;
  double pnl = 11;             // venue 权威浮盈（Order.Profit，后端透传，前端不自算 D-043）
  double swap = 12;
  double commission = 13;
  string comment = 14;
  bool is_arb = 15;            // comment 前缀 = exec.OrderComment("arb") → ARB 源订单
  google.protobuf.Timestamp opened_at = 16;
  int64 magic = 17;            // MT5 ExpertId / MT4 MagicNumber；0 = 无（手动单）
  bool venue_online = 18;      // venue 在线状态；false = 最近快照（离线，非实时）
  int64 position_id = 19;      // S4：关联持仓组合 ID；0 = 未关联（孤儿订单）
  string account_alias = 20;   // F3：账号别名（broker_accounts.alias）；空 = 未设别名，前端回落 venue
  double margin = 21;          // D-124：分摊保证金 USD（方案 C）；0=未知/CEX/无账户数据
  string order_id = 22;        // S4：关联持仓 OPEN 腿的 order_id（position_legs.order_id 透出）；空=未关联/孤儿
  double sl = 23;              // D-155：broker 端止损 SL 值透传（MT5 Order.StopLoss / MT4 Order.StopLoss；0=未设/CEX 无概念）；D-146 S1 灾难 SL 生产验证闭环基础设施
  google.protobuf.Timestamp swap_charge_at = 24;  // D-337R1 语义：下次计费/结算时刻（MT5=server 零点 swap，venue 时区换算 UTC；CEX=下次 funding 结算 UTC）；nil=时区/周期未知（诚实空态）
  double funding_rate_periodic_pct = 25;  // D-337R1：CEX 周期费率 %（=年化/(365×periods)，零信任后端换算）；0=未知诚实空态
}

message ListBrokerPositionsRequest {
  bool refresh = 1;   // true = 强制触发一次 venue 轮询后返回（前端「刷新」/平仓后立即刷新）
}

message ListBrokerPositionsResponse {
  repeated BrokerPosition positions = 1;
}

message CloseBrokerPositionRequest {
  string venue_key = 1;
  string ticket = 2;
}

message CloseBrokerPositionResponse {
  string status = 1;   // CLOSED / FAILED
  string message = 2;
}

message CloseBrokerPositionsRequest {
  repeated CloseBrokerPositionRequest items = 1;
}

message CloseBrokerPositionsResponse {
  repeated CloseBrokerPositionResponse results = 1;   // 逐条 CLOSED/FAILED（单条失败不阻断后续）
}

// === PersonalPosition（财务线 TRX 持仓接入，D-046）===

message PersonalPosition {
  int64 id = 1;
  string asset = 2;
  string kind = 3;             // staking / short_hedge / other
  string price_symbol = 4;     // 监控价格源 canonical（'TRXUSDT'）
  double price = 5;            // 当前 mid（后端算；0 = 无报价）
  double warn_high = 6;        // 0 = 未设
  double crit_high = 7;        // 0 = 未设（semantic = 强平价，权威值待业主回填）
  string level = 8;            // 'ok'|'warn'|'crit'（后端算；空 = 无报价）
  string note = 9;
  string status = 10;          // OPEN / CLOSED
  double qty = 11;             // 持仓数量；0 = 未填
  double entry_price = 12;     // 开仓价；0 = 未填
  int32 leverage = 13;         // 杠杆倍数；0 = 未填
  google.protobuf.Timestamp opened_at = 14;  // 开仓时间；null = 未填
  double pnl_usd = 15;         // 浮动盈亏（空单腿，后端算）；0 = 非空单腿/无报价
  double liq_price = 16;       // 强平价：crit_high 优先，否则理论值；0 = 算不出
  double dist_to_liq_pct = 17; // 距强平 % = (liq−现价)/现价；负数 = 已破线；算不出 = 0
  double accrued_interest_usd = 18;  // 累计利息 = SUM(position_daily_income.interest_usd)，后端算
}

message ListPersonalPositionsRequest {}

message ListPersonalPositionsResponse {
  repeated PersonalPosition items = 1;
}

// === D-212 对冲工作台：结构卡 + 统一流水卡（替换旧 ListCMCAccount/ListTRXAccount）===

message HedgeStake {
  double energy = 1;     // 能量质押（TRX，fin_trx_account.energy_delegated ÷ 1e6）
  double bandwidth = 2;  // 带宽自押（TRX，fin_trx_account.bandwidth_staked ÷ 1e6）
}

message HedgeLegSpot {
  string label = 1;          // "质押现货"
  double qty_staked = 2;     // 质押数量（v1.2：fin_trx_account.votes_total=18070，禁 personal_positions 静态）
  double qty_liquid = 3;     // 流动余额（fin_trx_account.balance_sun ÷ 1e6）
  double pnl_vs_base = 4;    // 对冲镜像=−空单平台自报 PnL（现货购价未知，镜像近似）
  HedgeStake stake = 5;      // 质押明细 energy+bandwidth
  // D-231 S3：投票收益率（fin_trx_vote_apr 最新行透传，只渲染不运算）
  double vote_apr_current = 6;    // 当前投票票数加权平均年化 %
  double vote_apr_max = 7;        // 市场最高年化 %（producer=true 降序第一）
  string vote_apr_max_sr = 8;     // 最高年化 SR 名
  double vote_apr_spread = 9;     // max−current 差值（pp）
  google.protobuf.Timestamp vote_apr_ts = 10;  // fin_trx_vote_apr.fetched_at
}

message HedgeLegShort {
  string label = 1;           // "CMC 空单"
  double qty = 2;             // 空单数量（fin_cmc_positions.quantity=18100）
  double pnl_vs_base = 3;     // 计算值 (baseline−mid)×qty（镜像腿，恒和=0）
  int32 lev = 4;              // 杠杆（1/margin_percentage 推导）
  double liq = 5;             // 强平价（fin_cmc_account_summary.closeout_price）
  double dist_pct = 6;        // 距强平%（distance_to_closeout_pct）
  double broker_unrealised = 7;  // broker 权威浮盈（fin_cmc_positions.unrealised_pnl，参考展示不做镜像源）
}

message HedgeCarry {
  double trx_rental_7d_trx = 1;   // 近 7 日能量租金（SumDailyIncomeByRange energy_trx）
  double trx_vote_7d_trx = 2;     // 近 7 日投票收益（SumDailyIncomeByRange voting_trx）
  double cmc_overnight_7d_usd = 3; // 近 7 日隔夜息（SumCMCOvernightByRange）
  double cum_usd = 4;             // 累计收益 USD（全量 energy×price+voting×price+interest）
  double annualized_pct = 5;      // 年化 %（cum_usd / (qty×mid) × 365）
  double hedged_cum_usd = 6;        // D-236 变更15：对冲后累计（窗口=[hedgeStart,now]）
  double hedged_annualized_pct = 7; // D-236 变更15：对冲后年化（时间感知，days=max(1,now−hedgeStart)）
  double mtd_net_usd = 8;        // D-260 S2：月至今净额 USD（月窗 energy×mid+voting×mid+interest）
  int32 mtd_sample_days = 9;     // D-260 S2：月内 rollup 行数（0=月初冷启动，前端显示「—」）
}

message HedgeAccounts {
  double trx_balance = 1;        // fin_trx_account.balance_sun ÷ 1e6
  double trx_allowance = 2;      // fin_trx_account.allowance_sun ÷ 1e6
  double energy_delegated = 3;   // fin_trx_account.energy_delegated ÷ 1e6
  double votes = 4;              // fin_trx_account.votes_total
  double cmc_cash = 5;           // fin_cmc_account_summary.total_cash_balance
  double cmc_equity = 6;         // fin_cmc_account_summary.total_account_value
  google.protobuf.Timestamp updated_at = 7;  // 最近更新时间（取 TRX/CMC 较新者）
  // D-278 S5：地址资源显示（剩余带宽/能量，后端算好前端零计算）
  double net_limit = 8;          // 带宽上限（BP，链上 sun 原值直接透传，不 ÷1e6）
  double net_used = 9;           // 已用带宽（BP，链上 sun 原值直接透传）
  double free_net_limit = 10;    // 免费带宽上限（BP，链上 sun 原值直接透传）
  double free_net_used = 11;     // 免费已用带宽（BP，链上 sun 原值直接透传）
  double energy_limit = 12;      // 能量上限（Energy，链上原值直接透传，不 ÷1e6）
  double energy_used = 13;       // 已用能量（Energy，链上原值直接透传）
  string bandwidth_status = 14; // 带宽状态 normal/yellow/red（后端算，阈值=trxvote 常量同源引用禁双写）
}

message HedgeStructure {
  double baseline_price = 1;   // fin_cmc_positions.entry_price（基准=空单开仓价，现货购价未知）
  double mid = 2;              // fin_cmc_prices 最近 mid（两腿共用同一 mid=镜像成立）
  HedgeLegSpot leg_spot = 3;
  HedgeLegShort leg_short = 4;
  double net_exposure_trx = 5;  // v1.2 真实计算 (balance+staked−short_qty)
  double net_exposure_usd = 6;  // net_exposure_trx × mid
  HedgeCarry carry = 7;
  HedgeAccounts accts = 8;
  bool ws_connected = 9;  // cmc ws 事件驱动健康（true=绿/false=黄，兜底中）
  string closeout_source = 10;       // D-225 v2.2：强平价口径（"platform_rule_50"=平台 50% 规则）
  string platform_alert_state = 11;  // D-225 v2.1：平台预警状态 normal/warning/breach（F13 alerts 直读）
  string platform_alerts = 12;       // D-225 v2.1：alerts 原文 JSON 透传（前端只渲染）
  double closeout_level_usd = 13;    // D-225 v2.2：平台强平净值 = totalMarginAmount × 50%
  double warning_level_usd = 14;    // D-225 v2.2：平台预警净值 = totalMarginAmount × 80%
  double ask = 15;                  // D-234 R-V S3：现价=ask（ForSide Sell 口径=强平/PnL 同源，业主批 A）
}

message GetHedgeStructureRequest {}

message GetHedgeStructureResponse {
  HedgeStructure structure = 1;  // 空表容忍=nil（前端显示「数据未就绪」）
}

message HedgeFlowItem {
  string source = 1;           // trx|cmc
  google.protobuf.Timestamp ts = 2;
  string kind = 3;             // 归一 8 类：rental_income|vote_claim|deposit|withdraw|stake|unstake|overnight|other
  double amount_value = 4;     // 原生单位数值（TRX 笔=TRX 数；CMC 笔=USD）
  string amount_unit = 5;      // TRX|USD
  string counterparty = 6;     // TRX=对手方地址；CMC=空
  string tx_id = 7;            // TRX=tx_id；CMC=transaction_id
}

message ListHedgeFlowRequest {
  string source_filter = 1;    // ""=全部；trx=单源；cmc=单源
  int32 limit = 2;
  int32 offset = 3;
}

message ListHedgeFlowResponse {
  repeated HedgeFlowItem txs = 1;
}

// === 每日收益（财务线工作项 3：个人持仓实账化）===

message PositionDailyIncome {
  int64 id = 1;
  string day = 2;              // YYYY-MM-DD（一日一条，全组合计）
  double energy_trx = 3;       // 能量收益（手动）
  double voting_trx = 4;       // 投票收益（手动）
  double interest_usd = 5;     // 资金费/利息（手动）
  double price = 6;            // 记录时 TRX 现价（后端自动快照；0 = 无报价）
  double pnl_usd = 7;          // 记录时空单浮动盈亏（后端自动算；0 = 无报价/无 entry）
  string note = 8;
  double income_usd = 9;       // 后端算 = energy×price + voting×price + interest（price 无值按 0）
  string warning = 10;         // 后端算：资金费翻负/急降预警；空 = 正常（D-043）
}

message AddDailyIncomeRequest {
  string day = 1;             // YYYY-MM-DD（非法拒绝；同 day = upsert 覆盖，支持纠错）
  double energy_trx = 2;
  double voting_trx = 3;
  double interest_usd = 4;
  string note = 5;
}

message AddDailyIncomeResponse {
  int64 id = 1;
  string warning = 2;          // 本次提交即时预警（同 §11.1 规则）；空 = 正常
}

// F4 盈亏统计起点（stats_anchor 单行表）
message GetPnlAnchorRequest {}
message GetPnlAnchorResponse {
  google.protobuf.Timestamp anchor = 1;  // 累计已实现口径起点（closed_at >= anchor）
  double realized_since_anchor = 2;      // SUM(realized_pnl) WHERE closed_at >= anchor（后端口径）
}
message ResetPnlAnchorRequest {}
message ResetPnlAnchorResponse {
  google.protobuf.Timestamp anchor = 1;  // 重置后的 anchor（= now()）
}

// F8 经验库只读浏览
message KBEntry {
  string id = 1;
  string kind = 2;        // pitfall / invariant / pattern
  string keywords = 3;
  string summary = 4;
  string status = 5;      // verified / draft
  string risk = 6;        // high / medium / low
}
message ListKBEntriesRequest {}
message ListKBEntriesResponse {
  repeated KBEntry entries = 1;
}
message GetKBEntryRequest {
  string id = 1;
}
message GetKBEntryResponse {
  string id = 1;
  string content = 2;     // 条目 markdown 全文（含 frontmatter）
}

message ListDailyIncomeRequest {
  string from = 1;   // 可选起始日 YYYY-MM-DD；空 = 不设界
  string to = 2;     // 可选截止日 YYYY-MM-DD；空 = 不设界
  int32 limit = 3;   // ≤0 默认 200
  int32 offset = 4;
}

message ListDailyIncomeResponse { repeated PositionDailyIncome items = 1; }

// === StreamUpdates（D-026，server streaming）===

message StreamUpdatesRequest {}

// 实时现价推送（D-049）：后端按最新未陈旧报价算价格派生字段，前端仅按 id 合并渲染。
message PersonalPositionPrice {
  int64 position_id = 1;
  double price = 2;            // 当前 mid（0 = 无报价）
  string level = 3;            // 'ok'|'warn'|'crit'（空 = 无报价）
  double pnl_usd = 4;
  double liq_price = 5;
  double dist_to_liq_pct = 6;
}

message StreamUpdatesResponse {
  oneof update {
    Quote quote = 1;
    Opportunity opportunity = 2;
    Alert alert = 3;
    Position position = 4;
    SourceHealth source_health = 5;
    Keepalive keepalive = 6;     // 30s 心跳（Cloudflare Tunnel 存活，D-027）
    PersonalPositionPrice personal_position_price = 7;  // 实时个人持仓现价（D-049）
    BrokerPositionSnapshot broker_positions = 8;        // Broker 实持仓实时推送（全量快照）
    AccountSnapshot accounts = 9;                       // 账户资产实时推送（全量快照，D-053）
    FundingNeedNotice funding_need = 10;                // 资金注入提醒弹窗（D-072，余额不足实时推）
    PositionChangeNotice position_change = 11;          // 持仓变更通知（D-107 P3，只含通知不含数据）
    HedgeRefreshNotice hedge_refresh = 12;              // 对冲结构刷新通知（D-231 S5，空消息→前端重取）
    CMCWatchUpdate cmc_update = 13;                     // CMC 看盘实时帧（D-234，后端现算载荷→前端 merge 渲染）
  }
}

// HedgeRefreshNotice（D-231 S5）：TRX 投票/质押/余额变化 → 对冲结构卡刷新通知。
// 空消息——前端零信任：收到→调 getHedgeStructure 重取（复用 case 11 通知→重取模式）。
message HedgeRefreshNotice {}

// CMCWatchUpdate（D-234）：CMC 看盘实时帧——后端 1s 蓄压后现算载荷，前端按字段 merge 渲染（不全量 load）。
// 公式与 GetHedgeStructure 同源（mid=REST mid、ask=ForSide Sell、bid=持仓 EvaluationBidPrice、
// 双腿 PnL=(baseline−pnlPx)×mirrorQty 镜像恒和=0、强平/预警净值=usedMargin×50%/80%）。
message CMCWatchUpdate {
  double mid = 1;                  // fin_cmc_prices 最近 mid（REST 行，WS 行 mid=NULL 不污染）
  double bid = 2;                  // fin_cmc_positions.evaluation_bid_price（type7 patch 更新，15s 节流落库）
  double ask = 3;                  // ForSide(Sell)=WS ask 优先回退 REST ask（与 GetHedgeStructure evalAsk 同源）
  double baseline_price = 4;       // fin_cmc_positions.entry_price（基准=空单开仓价）
  double leg_spot_pnl = 5;         // (pnlPx−baseline)×mirrorQty（镜像腿，恒和=0）
  double leg_short_pnl = 6;        // (baseline−pnlPx)×mirrorQty（镜像腿，恒和=0）
  double dist_to_closeout_pct = 7; // fin_cmc_account_summary.distance_to_closeout_pct
  double closeout_level_usd = 8;   // used_margin × 50%（平台口径 platform_rule_50）
  double warning_level_usd = 9;    // used_margin × 80%
  double cmc_cash = 10;            // fin_cmc_account_summary.total_cash_balance
  double cmc_equity = 11;          // fin_cmc_account_summary.total_account_value
  double used_margin = 12;         // fin_cmc_account_summary.total_equity_used_in_margin（=totalMarginAmount F12）
  double short_qty = 13;           // fin_cmc_positions.quantity（基准 qty，两腿镜像共用）
  int32 short_lev = 14;            // 1/margin_percentage 推导
  string platform_alert_state = 15; // normal/warning/breach（F13 alerts 直读）
  bool ws_connected = 16;          // CMC ws 事件驱动健康（true=绿/false=黄 REST 兜底）
  string closeout_source = 17;     // "platform_rule_50"（D-225 v2.2 标定）
  google.protobuf.Timestamp quote_time = 18; // mid 行 fetched_at（无 mid=零值）
  double short_liq = 19;           // D-234 R-V S3：强平价（fin_cmc_account_summary.closeout_price，与 HedgeLegShort.liq 同源）
  double net_exposure_usd = 20;    // D-234 R-V S3：净敞口 USD（netExposureTrx × mid，与 GetHedgeStructure 同源）
}

// 持仓变更通知（D-107 P3）：OnOrderUpdate 事件经 orderTopic → StreamUpdates case 11 推送。
// 只含通知不含数据——前端零信任：收到通知→调既有 RPC 重取（useSnapshot/usePositionsPage 等）。
message PositionChangeNotice {
  string venue = 1;
  int64 ticket = 2;
}

// 资金注入提醒（D-072）：swap 套利余额不足时实时弹窗（不入 alerts 表，断线不回放）。
// NeedUSD = minNotional − min(equityLong, equityShort)（差额，正数）。
message FundingNeedNotice {
  string canonical = 1;
  string venue_long = 2;
  string venue_short = 3;
  string reason = 4;           // SwapArbNotional 返回的 reason（含具体数值）
  double need_usd = 5;         // 需注入资金（USD）；0 = 仅 venue 离线/币种不符等非余额原因
  google.protobuf.Timestamp ts = 6;
  string alias_long = 7;       // D-154 返修②：买腿别名（后端 aliasOrKey 填充，空=无别名）
  string alias_short = 8;      // D-154 返修②：卖腿别名（后端 aliasOrKey 填充，空=无别名）
