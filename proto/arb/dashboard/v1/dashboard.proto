// === StrategyLedger（D-080 S5：理论 vs 实际对账）===

message GetStrategyLedgerRequest {
  // 筛选：空=全策略；指定=单策略聚合
  string strategy = 1;
}

message StrategyLedgerEntry {
  string strategy = 1;              // SWAPARB / CARRY / FUNDING_HEDGE / PERP_FUNDING / CROSS_VENUE / MEANREVERT
  int32  total_positions = 2;       // 总持仓数（含已平）
  int32  open_positions = 3;        // 活跃持仓数
  double promised_annual_pct = 4;   // 承诺年化%（活跃持仓 expected_annual_pct 均值）
  double realized_pnl_usd = 5;      // 累计已实现盈亏（CLOSED 持仓 SUM(realized_pnl)）
  double avg_hold_days = 6;         // 平均持仓天数（CLOSED 持仓 closed_at-opened_at 均值）
  double actual_annual_pct = 7;     // 实际年化（realized_pnl / notional / hold_days × 365，估算）
}

message GetStrategyLedgerResponse {
  repeated StrategyLedgerEntry entries = 1;
}

// === Watchlist（D-090 自选报价条）===

// WatchlistItem D-090 返修包① R1：自选清单双维项（canonical + venues）。
// venues 空 = 全部源；非空 = 仅该 venueKey（"{venue}:{venueType}"）集合。
message WatchlistItem {
  string canonical = 1;
  repeated string venues = 2;  // venueKey 集合，空=全部源
}

message GetWatchlistRequest {}

message GetWatchlistResponse {
  repeated WatchlistItem items = 1;
}

message SetWatchlistRequest {
  repeated WatchlistItem items = 1;  // 全量替换，顺序即 sort
}

message SetWatchlistResponse {
  repeated WatchlistItem items = 1;  // 生效清单回显
}

// === Analyst（D-091 前端分析员，server streaming）===

message EntityRef { string type = 1; string id = 2; }        // position / opportunity / stat-vkey
message ChatTurn { bool user = 1; string text = 2; }
message AskAnalystRequest { string question = 1; repeated EntityRef context = 2; string page = 3; repeated ChatTurn history = 4; }
message AnalystCitation { string kind = 1; string ref = 2; string excerpt = 3; } // sql / kb / decision / code / entity
message SuggestedFollowUps { repeated string follow_ups = 1; }
message AnalystDone { bool grounded = 1; }                    // grounded=false=全程零引用
message AskAnalystResponse { oneof part { string delta = 1; AnalystCitation citation = 2; SuggestedFollowUps follow_ups = 3; AnalystDone done = 4; } }
message AppendAnalystNoteRequest { string question = 1; string summary = 2; repeated AnalystCitation citations = 3; }
message AppendAnalystNoteResponse { bool ok = 1; }

// D-091 返修② R3：AI 配置 DB 化
message GetAiSettingsRequest {}
message GetAiSettingsResponse {
  string base_url = 1;
  string model = 2;
  string api_key_masked = 3;  // 尾 4 位掩码（如 "****a1b2"），空=未设
  bool enabled = 4;
}
message SetAiSettingsRequest {
  string base_url = 1;
  string model = 2;
  string api_key = 3;   // 空=不改动原值
  bool enabled = 4;
}
message SetAiSettingsResponse { bool ok = 1; }
