// ListMappingSuggestions — 名字匹配既有 canonical 但合约规格不符（或尚可采纳）的建议映射。
// canonical 数量用户自定（从 broker 真实符号策展），新 broker 自动映射名字+合约匹配者；
// 这里返回名字匹配但未入库的候选：status=auto（合约一致，一键采纳）/
// conflict（合约不符，待确认，采纳需 override）。D-042。
