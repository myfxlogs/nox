}

// 合约规格由后端自 broker 权威获取（零信任，前端不可传值）；override 仅人工确认时置真。
message SaveSymbolMappingRequest {
  string venue = 1;
  string broker_symbol = 2;
  string canonical = 3;
  optional bool override = 5;        // 合约规格不符时仍强制保存（人工确认；默认拒绝，防假映射）
}

message SaveSymbolMappingResponse {}

message DeleteSymbolMappingRequest {
  string venue = 1;
  string broker_symbol = 2;
}

message DeleteSymbolMappingResponse {}

// ListMappingSuggestions — 名字匹配既有 canonical 但合约规格不符（或尚可采纳）的建议映射。
// canonical 数量用户自定（从 broker 真实符号策展），新 broker 自动映射名字+合约匹配者；
// 这里返回名字匹配但未入库的候选：status=auto（合约一致，一键采纳）/
// conflict（合约不符，待确认，采纳需 override）。D-042。
message ListMappingSuggestionsRequest {
  string venue = 1;     // 已连接适配器的 venue
}

message SymbolMappingSuggestion {
  string broker_symbol = 1;
  string group = 2;
  double contract_size = 3;   // 0 = 未知
  string canonical = 4;       // 建议映射到的既有 canonical
  string status = 5;          // auto / conflict
  string reason = 6;          // conflict 时说明不符原因；auto 可为空
}

message ListMappingSuggestionsResponse {
  repeated SymbolMappingSuggestion suggestions = 1;
}

