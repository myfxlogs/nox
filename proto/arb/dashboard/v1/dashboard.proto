  string canonical = 2;      // 匹配到的 canonical（no_match 时为空）
  string group = 3;
  double contract_size = 4;
  string status = 5;         // auto / conflict / multi_hit / trade_disabled / no_match / already_mapped
  string reason = 6;         // 跳过原因
}

message AutoMapBrokerResponse {
  repeated AutoMapBrokerResult results = 1;
  int32 applied = 2;         // auto 状态已写入数
  int32 skipped = 3;         // 跳过数
}

