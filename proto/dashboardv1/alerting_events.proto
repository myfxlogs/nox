syntax = "proto3";

package arb.dashboard.v1;

option go_package = "arb/internal/gen/dashboardv1;dashboardv1";


// ==== alerting_events.proto —— D-508 S10 自 dashboard.proto 按域拆出（纯搬家：消息名/字段号/RPC 契约零漂移）。 ====

// === D-292 价格提醒规则前端管理 ===

// PriceAlertRuleRow 对应 price_alerts 表一行（管理面视图）。
message PriceAlertRuleRow {
  int64 id = 1;
  string symbol = 2;        // 规范化大写，如 TRXUSDT
  string op = 3;            // ">=" | "<="
  double threshold = 4;
  string level = 5;         // info|warn|critical
  string message = 6;
  bool enabled = 7;
  string last_alert_at = 8; // RFC3339，空=从未触发
  bool source_matched = 9;  // 后端填：symbol 是否在 QuoteBus 已订阅集合（防 typo 永不触发）
}

message ListPriceAlertRulesRequest {}

message ListPriceAlertRulesResponse {
  repeated PriceAlertRuleRow rules = 1;
}

message CreatePriceAlertRuleRequest {
  string symbol = 1;
  string op = 2;
  double threshold = 3;
  string level = 4;
  string message = 5;
}

message CreatePriceAlertRuleResponse {
  bool ok = 1;
  string error = 2;          // 校验失败文案（前端原样展示）
  PriceAlertRuleRow rule = 3; // 成功时回显新建行（含 id/source_matched）
}

message UpdatePriceAlertRuleRequest {
  int64 id = 1;
  string symbol = 2;
  string op = 3;
  double threshold = 4;
  string level = 5;
  string message = 6;
  bool enabled = 7;
}

message UpdatePriceAlertRuleResponse {
  bool ok = 1;
  string error = 2;
  PriceAlertRuleRow rule = 3; // 回显更新后行
}

message DeletePriceAlertRuleRequest {
  int64 id = 1;
}

message DeletePriceAlertRuleResponse {
  bool ok = 1;
  string error = 2;
}
