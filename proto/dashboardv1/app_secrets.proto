syntax = "proto3";

package arb.dashboard.v1;

option go_package = "arb/internal/gen/dashboardv1;dashboardv1";

import "google/protobuf/timestamp.proto";

// ==== app_secrets.proto —— D-545：app_secrets 密钥管理面（SettingsPage 密钥卡数据源）。 ====
// 闸门：密钥值永不回传（has_value/source/hot 足够前端渲染；连掩码也不回传）。

message AppSecretKey {
  string key = 1;
  string group = 2;
  bool has_value = 3;            // 永不回传值
  string value_source = 4;       // db|env|none
  bool hot = 5;                  // true=即改即效 false=重启生效（如实标）
  google.protobuf.Timestamp updated_at = 6;
  string note = 7;               // 审计事由（最近写库行）
  string desc = 8;               // 中文一句话说明
}

message ListAppSecretsRequest {}
message ListAppSecretsResponse {
  repeated AppSecretKey keys = 1;
}

message UpdateAppSecretRequest {
  string key = 1;    // 白名单 fail-closed（IsAppSecretKey；未知键 400）
  string value = 2;  // 空串=删行（前端「清除」操作映射）
  string note = 3;   // 必填——事由即审计
}
message UpdateAppSecretResponse {
  AppSecretKey key = 1;  // 更新后键视图
}
