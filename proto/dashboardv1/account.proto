syntax = "proto3";

package nox.dashboard.v1;

option go_package = "nox/internal/gen/dashboardv1;dashboardv1";


import "google/protobuf/timestamp.proto";

// ==== account.proto —— D-508 S10 自 dashboard.proto 按域拆出（纯搬家：消息名/字段号/RPC 契约零漂移）。 ====

// === KnowledgeEntry（§2.9）===

message KnowledgeEntry {
  int64 id = 1;
  google.protobuf.Timestamp ts = 2;
  string signature = 3;
  string venue = 4;
  string symbol = 5;
  string verdict = 6;
  string rationale = 7;
  string source = 8;
  string status = 9;                    // active / superseded / retracted
  google.protobuf.Timestamp validated_at = 10;
  string validation_note = 11;
}

message ListKnowledgeEntriesRequest {}

message ListKnowledgeEntriesResponse {
  repeated KnowledgeEntry entries = 1;
}

// === 每日收益（财务线工作项 3：个人持仓实账化）===

message PositionDailyIncome {
  int64 id = 1;
  string day = 2;              // YYYY-MM-DD（一日一条，全组合计）
  double energy_trx = 3;       // 能量收益（手动）
  double voting_trx = 4;       // 投票收益（手动）
  double interest_usd = 5;     // 资金费/利息（手动）
  double price = 6;            // 记录时 TRX 现价（后端自动快照；0 = 无报价）
  double pnl_usd = 7;          // 记录时空单浮动盈亏（后端自动算；0 = 无报价/无 entry）
  string note = 8;
  double income_usd = 9;       // 后端算 = energy×price + voting×price + interest（price 无值按 0）
  string warning = 10;         // 后端算：资金费翻负/急降预警；空 = 正常（D-043）
}

message AddDailyIncomeRequest {
  string day = 1;             // YYYY-MM-DD（非法拒绝；同 day = upsert 覆盖，支持纠错）
  double energy_trx = 2;
  double voting_trx = 3;
  double interest_usd = 4;
  string note = 5;
}

message AddDailyIncomeResponse {
  int64 id = 1;
  string warning = 2;          // 本次提交即时预警（同 §11.1 规则）；空 = 正常
}

// F4 盈亏统计起点（stats_anchor 单行表）
message GetPnlAnchorRequest {}
message GetPnlAnchorResponse {
  google.protobuf.Timestamp anchor = 1;  // 累计已实现口径起点（closed_at >= anchor）
  double realized_since_anchor = 2;      // SUM(realized_pnl) WHERE closed_at >= anchor（后端口径）
  double realized_today = 3;             // D-508 S8：当日已实现（closed_at>=当日零点，DB 时钟口径；前端直读不再聚合）
  double floating_net_usd = 4;           // D-141：Σ active 仓 close_now_net_usd + Σ 游离腿 close_now_estimate_usd（全平到手口径）
  bool floating_available = 5;           // D-141：false=任一仓/腿净估缺（断流/报价陈旧）→ 前端「—」不冒充 0
  // D-123：真北行——30d 净年化（selfwatch/stage2 同源 NetRealizedSince(30d)/CapitalBase；
  // 前端直读零算）。available=false（CapitalBase 缺/查询败）→ 前端「—」不冒充。
  double net_ann_30d_pct = 6;
  bool net_ann_30d_available = 7;
}
message ResetPnlAnchorRequest {}
message ResetPnlAnchorResponse {
  google.protobuf.Timestamp anchor = 1;  // 重置后的 anchor（= now()）
}

// F8 经验库只读浏览
message KBEntry {
  string id = 1;
  string kind = 2;        // pitfall / invariant / pattern
  string keywords = 3;
  string summary = 4;
  string status = 5;      // verified / draft
  string risk = 6;        // high / medium / low
}
message ListKBEntriesRequest {}
message ListKBEntriesResponse {
  repeated KBEntry entries = 1;
}
message GetKBEntryRequest {
  string id = 1;
}
message GetKBEntryResponse {
  string id = 1;
  string content = 2;     // 条目 markdown 全文（含 frontmatter）
}

message ListDailyIncomeRequest {
  string from = 1;   // 可选起始日 YYYY-MM-DD；空 = 不设界
  string to = 2;     // 可选截止日 YYYY-MM-DD；空 = 不设界
  int32 limit = 3;   // ≤0 默认 200
  int32 offset = 4;
}

message ListDailyIncomeResponse { repeated PositionDailyIncome items = 1; }

// === 账户资产（D-053）===

// 单个账户资金视图（CFD AccountSummary / CEX 签名余额查询）。
// CEX 行的 margin/free_margin/credit/profit = 0（无对应概念，前端按 asset_type 置「—」）。
message AccountInfo {
  string venue_key = 1;    // "{venue}:{venueType}"（277842155:mt5 / binance:spot）
  string venue = 2;        // 展示名（账号号 / binance / okx）
  string venue_type = 3;   // mt5 / mt4 / spot
  string asset_type = 4;   // cfd / cex
  double balance = 5;      // 余额（CEX = 币种计价总权益，USDT 估算/权威 totalEq）
  double equity = 6;       // 净值
  double margin = 7;       // 占用保证金（CFD；CEX 0）
  double free_margin = 8;  // 可用保证金（CFD；CEX 0）
  double credit = 9;       // 信用（CFD；CEX 0）
  double profit = 10;      // 浮动盈亏（CFD；CEX 0）
  double leverage = 11;
  string currency = 12;    // USD / USDT / EUR…
  bool online = 13;        // false = 最近成功快照（离线）
  google.protobuf.Timestamp updated_at = 14;
  bool simulated = 15;     // CEX 模拟盘标记（OKX demo=true/binance 实盘=false；CFD 零值 false 无意义——CFD 实盘/模拟由 BrokerAccount.isReal 管）
  string website = 16;     // 官网（D-157 V3：CEX 从 ExchangeConfig.website 透传；CFD 从 BrokerAccount.website 透传；空 = 未设置）
  repeated Holding holdings = 17;  // 币种明细（D-273 S2：CEX 现货采集器保留明细不丢弃；只含 qty>0；CFD 空）
  double buffer_multiple = 18;     // D-405 S2：CEX 距强平缓冲倍数=equity/MMR（写时归一；0=未采，CFD/spot 恒 0）
}

// === D-405 S6 账户资金与保证金 ===

message ListAccountMarginStatusRequest {}

// AccountMarginStatus 单账户保证金档位行（marginGuard 每轮评估 upsert 的 fin_venue_margin_status
// + fin_venue_account_snapshot 最新行 join）。tier=normal/warn/urgent/data_stale；
// coverage_days 为余粮覆盖天数（CEX 用 (equity−MMR)/日波动额 折算，0/负=不可算按 tier 呈现）。
message AccountMarginStatus {
  string venue = 1;
  string venue_type = 2;              // mt5 / unified / perp / spot / funding / earn
  string asset_type = 3;              // cfd / cex（venue_type 推导）
  double balance = 4;
  double equity = 5;
  double margin_used = 6;             // 已用保证金（MT=equity−free_margin；CEX≈equity/buffer=MMR）
  double free_margin = 7;             // 可用保证金（MT=free_margin_raw；CEX≈equity−MMR 头room）
  double coverage_days = 8;           // 余粮天数（噪声自适应；<0=不适用）
  double suggested_topup_usd = 9;     // 预警档缺口额（够档=0）
  string tier = 10;
  string currency = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message ListAccountMarginStatusResponse {
  repeated AccountMarginStatus rows = 1;
}

// 单账户币种明细持有（D-273 S2）。
message Holding {
  string ccy = 1;         // 币种
  double qty = 2;         // 本币数量（OKX cashBal 缺失 fallback availBal / Binance free+locked）
  double usdt_value = 3;  // USD 估值（OKX eqUsd——2026-09-10 实采实证 eq 为本币权益非 USD；Binance qty×USDT 价，无价=0 保留）
}

message ListAccountsRequest {}

message ListAccountsResponse {
  repeated AccountInfo accounts = 1;
}

message Keepalive {
  google.protobuf.Timestamp ts = 1;
}

// === Finance Overview（D-348 财务 Tab 第一性重构：三个数+收益分解+统一流水）===

message GetFinanceOverviewRequest {}

// FinancePnlByEnv 已实现 PnL 按环境分层（real/demo；environment NULL=legacy real 链路）。
message FinancePnlByEnv {
  string environment = 1;
  double realized_pnl = 2;
  int32 closed = 3;
}

// FinanceIncomeRow 收入构成按类型（funding/swap/commission；cashflows 全量口径）。
message FinanceIncomeRow {
  string kind = 1;
  double total_usd = 2;
  int32 rows = 3;
}

// FinanceFlowRow 统一流水行（双源合并：income_events 结算 / position_cashflows 实数轨
// quality<>'estimated'；防双计=estimated 排除+同 venue+kind 时间轴无重叠；
// 防漏计=NULL 轨必入——okx/MT 结算实数 income_events 不覆盖）。D-120 清退 ledger 台账源。
message FinanceFlowRow {
  google.protobuf.Timestamp ts = 1;
  string source = 2;       // venue（binance / 277842155…）
  string kind = 3;         // funding/swap/commission
  string symbol = 4;       // income_events 有；cashflows 组合级无（诚实空）
  double amount_usd = 5;
  int64 position_id = 6;   // 0=非持仓级
  string note = 7;
}

message GetFinanceOverviewResponse {
  // D-120：ledger 手工台账清退，deposited_usd/net_pnl_usd 字段退役（保留号位不重用）。
  reserved 1, 3;
  reserved "deposited_usd", "net_pnl_usd";
  double total_equity_usd = 2;  // Σ AccountInfo.equity（在线或快照；只计实盘：CFD broker_accounts
                                // is_real=true 且非 stopped / CEX simulated=false；非 USD 计价跳过+warn）
  repeated FinancePnlByEnv pnl_by_env = 4;
  repeated FinanceIncomeRow income_by_kind = 5;
  repeated FinanceFlowRow flows = 6;  // ts 倒序 LIMIT 200
  double total_realized_usd = 7;      // D-508 S8：Σ pnl_by_env.realized_pnl（前端直读不再聚合）
  // D-522④：NAV 按结算币种分账（USD/USDT 各键，跨币永不加总——total_equity_usd 保留=USD 桶）。
  map<string, double> equity_by_ccy = 8;
  // D-535 业绩基线面（本金口径 USDT+USD，D-534）：锚缺 → perf_available=false 全组如实缺。
  double baseline_usd = 9;                // 基线锚（app_config baseline_usd）
  google.protobuf.Timestamp baseline_at = 10;
  double principal_now_usd = 11;          // 本金池现值=USDT+USD 两桶 NAV 合计
  double net_external_flow_usd = 12;      // 基线后外部充提净额（充正提负；内部划转不计）
  double perf_usd = 13;                   // 真业绩=本金池变动−净流
  double perf_ann_pct = 14;               // 年化=perf/天数×365/基线×100（days>0）
  bool perf_available = 15;               // false=锚缺/读败（前端显缺不显 0）
  bool perf_flow_provisional = 16;        // 净流扣减 provisional 标（perf_flow_provisional 键）
}

// === D-536 总览页聚合面（本金分档/业绩/在仓订单/风险心跳/待办一次下发） ===
message OverviewOrderRow {
  string kind = 1;            // dci / earn / autotrade / paper(沙箱)
  string label = 2;           // 可读名（venue+品名/持仓 id）
  double amount_usd = 3;      // 名义/本金（USD 口径）
  string status = 4;
  google.protobuf.Timestamp until = 5; // 到期/交割/开仓时（UTC——venue/CFD 全 UTC 世界）
}
message GetOverviewBundleRequest {}
message GetOverviewBundleResponse {
  // §0 待办
  int32 pending_requests = 1;
  // §1 本金分档（USDT+USD，D-534）
  double principal_total_usd = 2;
  double principal_idle_usd = 3;    // 可动用
  double principal_earning_usd = 4; // 在息（earn 池）
  double principal_locked_usd = 5;  // 锁定（DCI 在仓）
  google.protobuf.Timestamp earliest_release = 6; // 最早回笼时（锁定档最小到期）
  // §2 业绩（D-535 基线面）
  bool perf_available = 7;
  double baseline_usd = 8;
  google.protobuf.Timestamp baseline_at = 9;
  double perf_usd = 10;
  double perf_ann_pct = 11;
  bool perf_flow_provisional = 12;
  // §3 在仓订单统一行
  repeated OverviewOrderRow orders = 13;
  int32 paper_count = 14; // 纸面沙箱计数（标沙箱不入本金）
  // §4 风险心跳
  bool kill_switch = 15;
  double net30_usd = 16;      // 30d 滚动账本净额（对 −3% 硬线）
  int32 crit_alerts_24h = 17;
  // §5 十段工序实时状态（S3′-b：后端阶段健康读模——每段聚合 emit 时戳+
  // wait_reason+错误面；禁前端拿 dept 拼状态/禁前端判故障）。
  repeated PipelineStageHealth stages = 18;
  // §6 总投入+盘面组成明细（业主令：卡点击见组成——后端拆好前端直渲）。
  double net_invested_usd = 19;        // 总投入=基线锚+基线后净充提（USDT+USD；投资人累计出资口径）
  repeated OverviewBreakdownRow breakdowns = 20;
  bool invested_available = 21;        // 总投入可用标（无基线锚=如实缺不显 0）
  // §7 收益归因分解（产出面补建——净额按策略键归因，30d 滚动，后端聚合）。
  repeated OverviewAttribRow attribution = 24;
  // §8 闭环漏斗计数（八环各 48h 计数——发现→评估→沙箱→执行→持仓→平仓→账本→复盘→淘汰）。
  repeated OverviewFunnelRow funnel = 25;
  // §9 等待面缩览（pending/unqualified 毕业+proposed 提案——等待因+龄，后端聚合）。
  repeated OverviewWaitingRow waiting = 26;
  // §10 眠钱时长（idle_floor_streak 连续破地板天数 max——D-286 眠钱不眠计量）。
  int32 idle_streak_days = 27;
  string idle_streak_pool = 28; // 最长眠钱池（venue:venue_type；空=无在册破地板池）
  // §11 风险心跳 critical 明细（业主令 10-17：可见「是什么红」非只「有几个红」；
  // 24h 窗内 critical 告警后端拼行，前端零拼零新 RPC——bundle 既有 ListAlerts 读搭车）。
  repeated OverviewCritAlert crit_alerts = 29;
  // F1 显缺旗标（同族病灶第 5 例修——读败≠真值 0；perf_available/invested_available 同型范式）。
  bool principal_available = 30;    // nav 段读败→false（四瓦片显「—」不冒 $0）
  bool idle_streak_available = 31;  // streaks 读败→false（眠钱瓦片显「—」不冒「无在册破地板池」)
  // D-630 真实净盈利权威口径=Σ venue 权益差−Σ io 外部净流（归因面降级解释层后的唯一判定口径）。
  double true_net_30d_usd = 32;     // 30d 窗（快照基线有盖池才计）
  double true_net_all_usd = 33;     // 全时窗
  bool true_net_available = 34;     // 全池缺盖→false（显「—」不冒数）
  string true_net_uncovered = 35;   // 缺基线池清单（如实标缺面）
}

// OverviewCritAlert 24h critical 告警明细行（全行 level 恒=critical 不复列）。
// 归组语义（业主报障 10-18 同源告警霸屏）：message=组内最新一条原文、
// ts=组内最新时、count=组内告警数、first_ts=组内最早时；封顶截断尾行
// 「+N 组见告警页」以 count 携被截组内告警合计（Σcount 守恒=24h 计数）。
message OverviewCritAlert {
  string message = 1;                 // 组内最新一条告警文案原文（后端直透不裁剪）
  google.protobuf.Timestamp ts = 2;   // 组内最新告警时（last_ts）
  int32 count = 3;                    // 组内告警数（=1 即未归组；截断尾行=被截告警合计）
  google.protobuf.Timestamp first_ts = 4; // 组内最早告警时（跨度面）
}

// OverviewBreakdownRow 盘面卡组成行（group=对应 StatTile 键；label 行名+amount 原生量
// +ccy 计价币+sub 补充——前端按 group 过滤渲染，零运算零拼装）。
message OverviewBreakdownRow {
  string group = 1;   // nav/principal/idle/earning/invested/perf
  string label = 2;   // venue 名或科目名
  string ccy = 3;     // 计价币（USD/USDT 族可 fmtUsd；其余原生量如实显）
  double amount = 4;
  string sub = 5;     // venue_type/份额/科目注记
}

// OverviewAttribRow 收益归因行（strategy_key 同域模板键；type 回落=未归组行）。
message OverviewAttribRow {
  string strategy = 1;     // positions.strategy_key（空=未归组落 type 名）
  int32 positions = 2;     // 结算仓数
  double net30_usd = 3;    // 30d 结算净额合计
  int32 wins = 4;
  int32 losses = 5;
}

// OverviewFunnelRow 闭环漏斗环计数行。
message OverviewFunnelRow {
  string stage = 1;   // discovery/eval/sandbox/execution/holding/exit/ledger/review/elimination
  string label = 2;   // 中文环名
  int32 count_48h = 3;
  bool cumulative = 4; // true=环缺时戳列按累计计数如实标注
}

// OverviewWaitingRow 等待面缩览行。
message OverviewWaitingRow {
  string kind = 1;    // graduation_pending/graduation_watch/proposal
  string label = 2;   // 对象摘要（后端拼）
  string detail = 3;  // 等待因/关键值（后端拼）
  int64 since_unix = 4; // 等待起点（0=未知）
}

// PipelineStageHealth 工序段健康行（十段固定枚举 key 后文注释面）。
// state 枚举：working=🟢工作 / waiting=◐等待带因 / idle=—闲置 / error=🔴故障。
message PipelineStageHealth {
  string key = 1;            // collect/research/opp_publish/gate_eval/assembly/execution/holding/exit/ledger/review
  string state = 2;
  string narrative = 3;      // 一行实况叙事（后端聚合原文）
  string wait_reason = 4;    // 等待因（waiting 态有值）
  string error = 5;          // 故障面（error 态有值）
  int64 last_event_unix = 6; // 最近 emit 时戳（0=无）
  // S3′-c liveness 证据分型：beat=周期性心跳（超龄=断流嫌疑）/event=事件
  // 驱动（零事件≠病态）/none=无簿（如实缺凭据）。idle/waiting 语义分离：
  // idle=设计性闲置无活可干；waiting=被卡带因（wait_reason 必填）。
  string evidence_kind = 7;
}

// ExecutionModeView D-620⑦：执行模式+真金授权视图（live_gates active 行投影）。
message ExecutionModeView {
  string mode = 1;                            // READ_ONLY/PAPER/TEST/LIVE
  bool enabled = 2;                           // execution_controls.enabled（false=kill active）
  bool allowed = 3;                           // CheckGate 结论
  string reason = 4;                          // CheckGate 拒因（allowed=true 时 "allowed"）
  string gate_operator = 5;                   // live_gates.operator（无行=空）
  google.protobuf.Timestamp gate_confirmed_at = 6;
  google.protobuf.Timestamp gate_expires_at = 7;
  string gate_evidence_ref = 8;               // live_gates.evidence_ref
}

message GetExecutionModeRequest {}

message GetExecutionModeResponse {
  ExecutionModeView view = 1;
}

// SetExecutionModeRequest D-620⑦：执行模式写口（决策席 buf curl 径，Bearer 同 UpdateAppConfig 信任级）。
// mode=LIVE → ControlPlane.GrantLive（operator/reason/evidence_ref 非空+expires_at>now 必填+live_gates 落账）；
// 其余 → SetMode（降级自动撤 live_gates active 行）。
message SetExecutionModeRequest {
  string mode = 1;
  string actor = 2;
  string reason = 3;
  string evidence_ref = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message SetExecutionModeResponse {
  ExecutionModeView view = 1;
}

// DecideHypothesisRequest D-623：fin_opp_hypothesis 裁决写口（actor/reason/evidence_ref 必填，
// Bearer 同 SetExecutionMode 信任级——决策席 buf curl 径）。
message DecideHypothesisRequest {
  int64 id = 1;
  string decision = 2;      // approved|rejected（service 层枚举校验，仅 proposed 态受理）
  string actor = 3;
  string reason = 4;
  string evidence_ref = 5;
}

message DecideHypothesisResponse {
  int64 id = 1;
  string status = 2;
  string decided_by = 3;
  google.protobuf.Timestamp decided_at = 4;
}
