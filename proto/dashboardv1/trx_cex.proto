syntax = "proto3";

package nox.dashboard.v1;

option go_package = "nox/internal/gen/dashboardv1;dashboardv1";


import "google/protobuf/timestamp.proto";
import "dashboardv1/account.proto";

// ==== trx_cex.proto —— D-508 S10 自 dashboard.proto 按域拆出（纯搬家：消息名/字段号/RPC 契约零漂移）。 ====

// D-254：TrxAccountRefresh——手动刷新按钮+on-open 双踢 trx_account+trx_apr 后返回最新 fin_trx_account 全字段快照。
// Q3 裁定：sun 单位 ÷1e6 转 double（对齐 fin_trx_account 行口径，前端零换算）；votes_total 用 double（对齐 fin_trx_account.votes_total）。
// Q1 裁定：全 11 字段透出（unfrozen/sr_address 是 TronLink 展示集合，数据面一次到位，渲染扩展挂账）。
message TrxAccountRefreshRequest {}

message TrxAccountRefreshResponse {
  int64 id = 1;                    // fin_trx_account.id（内部主键，透出为完整性）
  string address = 2;              // 钱包地址
  string sr_address = 3;           // 投票 SR 地址（nil=空字符串）
  double trx_balance = 4;          // balance_sun ÷ 1e6（TRX）
  double trx_allowance = 5;        // reward_num_sun ÷ 1e6（D-285 链上真值，与 fin_trx_account.reward_num_sun 同源）
  double energy_delegated = 6;     // energy_delegated ÷ 1e6（TRX）
  double bandwidth_staked = 7;     // bandwidth_staked ÷ 1e6（TRX）
  double net_limit = 8;            // 带宽上限（BP，链上原值透传）
  double votes = 9;                // votes_total（票数，对齐 fin_trx_account.votes_total 不除 1e6）
  string unfrozen = 10;            // JSONB 透传（nil=空字符串，在途解押）
  google.protobuf.Timestamp fetched_at = 11;  // 采集时间
  // D-278 S5：地址资源显示（剩余带宽/能量）
  double net_used = 12;            // 已用带宽（BP，链上原值透传）
  double free_net_used = 13;       // 免费已用带宽（BP，链上原值透传）
  double free_net_limit = 14;      // 免费带宽上限（BP，链上原值透传）
  double energy_limit = 15;        // 能量上限（Energy，链上原值透传）
  double energy_used = 16;         // 已用能量（Energy，链上原值透传）
  string bandwidth_status = 17;   // 带宽状态 normal/yellow/red（后端算，阈值=trxvote 常量同源）
}

// D-258 S3：收益率雷达——后端算好，前端零计算（D-043 前端零信任）。
// 能量=实收年化（rental_income÷在押）；投票=SR APR（D-233 对拍口径）。
message GetTrxYieldRadarRequest {}

message GetTrxYieldRadarResponse {
  double energy_apr_7d = 1;     // 7d 能量租金年化 %
  double energy_apr_30d = 2;    // 30d 能量租金年化 %
  double vote_apr_current = 3;  // 当前投票 APR %（最新 fin_trx_vote_apr.current_rate）
  double vote_apr_30d_avg = 4; // 30d 投票 APR 均值 %
  double floor_pct = 5;        // floor 告警阈值 %（NOX_TRX_ENERGY_RATE_FLOOR_PCT）
  int32 sample_days_7d = 6;     // 7d 实际样本天数（冷启动 <7 时前端显示「样本不足」）
  int32 sample_days_30d = 7;   // 30d 实际样本天数
  google.protobuf.Timestamp updated_at = 8;  // 数据更新时间
  bool transition = 9;  // 扩容过渡期（7d 窗内 energy_delegated 变化>20%）：读数=旧租金÷新在押，floor 判定无效（9-9 B' 教训）
  // D-288：投票市场最高 APR（从 fin_trx_vote_apr 同行透传，消除投票年化行重复）
  double vote_apr_max = 10;      // 市场最高 APR %（producer=true 降序第一）
  string vote_apr_max_sr = 11;   // 最高 APR SR 名
  double vote_apr_spread = 12;   // max−current 差值（pp）
}

// D-278 S1：净收益率日曲线——后端聚合三成分日序列+滚动年化，前端零计算（D-043 前端零信任）。
// 数据源=position_daily_income（rollup 日序列）+ ticks TRXUSDT（现价）。
// 分母=$36.5K 池口径常量（与底稿可比，AF4）；S4 敞口并入响应。
message GetTrxYieldCurveRequest {
  int32 days = 1;  // 返回天数（≤0=默认 30）
}

message TrxYieldCurvePoint {
  google.protobuf.Timestamp day = 1;  // UTC 日期
  double energy_trx = 2;               // 当日能量租金收入（TRX）
  double voting_trx = 3;               // 当日投票收入（TRX）
  reserved 4;                          // interest_usd——CMC 域剔除
  double price = 5;                     // 当日 TRX 价格（TRXUSDT，nil=无报价）
  double daily_total_usd = 6;          // 当日合计收益 USD =（energy+voting）×price
}

message GetTrxYieldCurveResponse {
  repeated TrxYieldCurvePoint points = 1;  // 日序列（按 day ASC）
  double annualized_7d = 2;                 // 7d 滚动合成年化 %
  double annualized_30d = 3;                // 30d 滚动合成年化 %
  double current_price = 4;                 // 现价（ticks TRXUSDT mid，D-359 价锚）
  double pool_principal_usd = 5;             // 池本金 $36.5K（分母口径常量）
  int32 sample_days_7d = 6;                  // 7d 实际样本天数
  int32 sample_days_30d = 7;                 // 30d 实际样本天数
  // D-278 S4：收益敞口计量（累积未对冲 TRX 收益折 USD）
  double cumulative_unhedged_income_trx = 8;  // 累积未对冲 TRX 收益（rental+vote_claim 累计）
  double cumulative_unhedged_income_usd = 9;  // × 现价折 USD
  reserved 10, 11;                            // hedge_ratio_drift_*——CMC 域剔除
}

// D-271：CEX 只读扫描器快照
message GetCexScanSnapshotRequest {}
message GetCexScanSnapshotResponse {
  repeated CexEarnAPRRow earn_aprs = 1;
  repeated CexSpreadRow spreads = 2;
  repeated CexFundingRow fundings = 3;
  repeated CexBalanceRow balances = 4;
  repeated CexEarnJudgmentRow judgments = 5;  // D-273：earn APR 判断结果
}

// earn APR 判断结果行（D-273 S6）。
message CexEarnJudgmentRow {
  string venue = 1;
  string ccy = 2;
  string product_type = 3;
  double apr = 4;         // 小数年化（0.035=3.5%）
  string category = 5;    // stable / token
  string verdict = 6;     // opportunity / not_opportunity / trap
  repeated string reasons = 7;
}

message CexEarnAPRRow {
  string venue = 1;
  string ccy = 2;
  string product_type = 3;
  double apr = 4;         // 小数年化（0.035=3.5%）
  optional string tier_apr = 5;
  string ts = 6;          // RFC3339
}

message CexSpreadRow {
  string symbol = 1;
  string venue_buy = 2;
  string venue_sell = 3;
  double price_buy = 4;
  double price_sell = 5;
  double spread_bps = 6;
  string ts = 7;
  string verdict = 8;    // D-508 S8：色阶终值（spread_bps>=50→"opportunity" 否则 "not_opportunity"；阈值后端裁决）
}

message CexFundingRow {
  string venue = 1;
  string symbol = 2;
  double rate = 3;        // 小数年化
  string ts = 4;
  string verdict = 5;     // D-508 S8：色阶终值（年化>=10%→"opportunity" 否则 "not_opportunity"；阈值后端裁决）
}

message CexBalanceRow {
  string venue = 1;
  string venue_type = 2;
  double balance = 3;
  double equity = 4;
  double free_margin = 5;
  string venue_key = 6;           // D-273：稳定 React key（P2-6）
  repeated Holding holdings = 7;  // D-273：币种明细展开（P3-1）
}

// TRXTxRow 收入交易流行（fin_trx_txs 读面——TRX 页「发生了什么」区数据面；
// amount_trx=后端预折 TRX 单位（÷1e6 落后端，前端零换算））。
message TrxTxRow {
  int64 id = 1;
  string tx_id = 2;
  google.protobuf.Timestamp ts = 3;
  string kind = 4;          // rental_income|vote_claim|deposit|withdraw|stake|unstake|vote|delegate|undelegate|other…
  double amount_trx = 5;
  string counterparty = 6;  // 无对手方=空串
  bool cheat_status = 7;    // TronScan 官方恶意标记（D-279）
  google.protobuf.Timestamp fetched_at = 8;
}
message ListTrxTxsRequest {
  int32 limit = 1;          // ≤0=50
  string kind = 2;          // 空=全部；源过滤下推后端（前端零聚合令）
}
message ListTrxTxsResponse {
  repeated TrxTxRow txs = 1;
}
