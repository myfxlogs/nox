syntax = "proto3";

package nox.dashboard.v1;

option go_package = "nox/internal/gen/dashboardv1;dashboardv1";

import "google/protobuf/timestamp.proto";
import "dashboardv1/manual_position.proto";

// ==== capital_map.proto —— 资金地图（业主令 10-13 + D-285：按币种如实分组零换算） ====

message GetCapitalPoolsRequest {}

// CapitalDeployedPart 池内「在跑」归因明细（kind：position / dci / earn /
// margin——ref=人类可读引用，amount 单位=该池 currency）。
message CapitalDeployedPart {
  string kind = 1;
  string ref = 2;
  double amount = 3;
}

// CapitalPool 单 venue×venue_type 资金池：equity=快照权益（venue 扣款后余额），
// deployed=在跑归因合计（池内占用 + 池外锁额如未到期 DCI——锁额已离池，
// idle=equity−池内在跑，不双减，终审 G3 裁定），后端算前端零运算。
message CapitalPool {
  string venue = 1;
  string venue_type = 2;
  string currency = 3;
  double equity = 4;
  double idle = 5;
  double deployed = 6;
  bool online = 7;              // 数据通道活（快照在源节奏窗内）
  bool stale = 8;               // 快照超源节奏窗（展示置灰标时点）
  bool ghost = 9;               // 幽灵池（mt 户已移除的残行——NAV 剔计同源语义）
  google.protobuf.Timestamp updated_at = 10;
  repeated CapitalDeployedPart deployed_parts = 11;
  // D-516 共享持有归属：ownership_share<1 时 equity/idle/deployed 已是归属份；
  // custodial_equity=代管余量（面板如实标代管，不进分母不进判据）。
  double ownership_share = 12;
  double custodial_equity = 13;
}

// CapitalPoolsGroup 币种分组（D-285：USDT/USD/UST 各报各的，零汇率换算）。
message CapitalPoolsGroup {
  string currency = 1;
  double equity = 2;
  double idle = 3;
  double deployed = 4;
  repeated CapitalPool pools = 5;
}

message GetCapitalPoolsResponse {
  repeated CapitalPoolsGroup groups = 1;
  google.protobuf.Timestamp computed_at = 2;
  // 分母鲜度守卫：被剔的陈旧非幽灵池键（venue:venue_type）；非空=分母不完整，
  // 敞口/占比判据此标「分母缺池」而非拿陈旧值当现值。
  repeated string stale_pools = 3;
  bool denominator_incomplete = 4;
  // D-512：手工仓位台账行（src=manual）——只读展示并入全景面；
  // 不进分母不进敞口（物理隔离：groups/pools 恒不含 manual 行）。
  repeated ManualPosition manual_positions = 5;
}
