syntax = "proto3";
package nox.dashboard.v1;

option go_package = "nox/internal/gen/dashboardv1;dashboardv1";

// D-268 M4.6：投资人页请求箱回执面（fin_condition_gap requested 集读 +
// id+二态写回；态机判权全后端，前端零信任）。

message RequestBoxItem {
  int64 id = 1;
  string template_id = 2;   // 缺口所属机会模板
  string kind = 3;          // credential|permission|capital|constraint|holding
  string subject = 4;
  string request_text = 5;  // 业主可见请求原文
  int64 age_seconds = 6;    // requested 龄（后端算——零信任前端不算时）
}

message ListRequestBoxRequest {}

message ListRequestBoxResponse {
  repeated RequestBoxItem items = 1;
}

enum ResolveRequestState {
  RESOLVE_REQUEST_STATE_UNSPECIFIED = 0;
  RESOLVE_REQUEST_STATE_FULFILLED = 1; // 业主已喂条件
  RESOLVE_REQUEST_STATE_WAIVED = 2;    // 放弃该机会线
}

message ResolveRequestRequest {
  int64 id = 1;
  ResolveRequestState state = 2;
}

message ResolveRequestResponse {
  bool applied = 1; // 态机翻牌成=true；行已收口/非 requested=幂等 false
}

// GetActionBadge 投资人 nav 行动徽标——后端供单值（fe-design 挂账小票：
// 前端零计算令，status 聚合计数挪后端 SQL）。
message GetActionBadgeRequest {}
message GetActionBadgeResponse {
  int32 count = 1; // 待批毕业数 + 请求箱未决数
}
